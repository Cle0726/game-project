name: Simulation Runtime

on:
  pull_request:
    paths:
      - 'src/simulation/**'
      - 'src/exploration/**'
      - 'src/exploration-legacy-main.ts'
      - 'src/worldmap/worldMapBridge.ts'
      - 'scripts/assert-simulation-boundaries.mjs'
      - 'scripts/assert-chapter0-exploration.mjs'
      - 'scripts/audit-chapter0-route-graph.mjs'
      - 'scripts/assert-chapter1-exploration.mjs'
      - 'scripts/audit-chapter1-route-graph.mjs'
      - 'scripts/assert-chapter2-exploration.mjs'
      - 'scripts/audit-chapter2-route-graph.mjs'
      - 'tsconfig.simulation.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/simulation-runtime.yml'
  push:
    branches:
      - feat/simulation-runtime-v1
      - feat/chapter0-exploration
      - feat/chapter1-exploration
      - feat/chapter2-exploration
    paths:
      - 'src/simulation/**'
      - 'src/exploration/**'
      - 'src/exploration-legacy-main.ts'
      - 'src/worldmap/worldMapBridge.ts'
      - 'scripts/assert-simulation-boundaries.mjs'
      - 'scripts/assert-chapter0-exploration.mjs'
      - 'scripts/audit-chapter0-route-graph.mjs'
      - 'scripts/assert-chapter1-exploration.mjs'
      - 'scripts/audit-chapter1-route-graph.mjs'
      - 'scripts/assert-chapter2-exploration.mjs'
      - 'scripts/audit-chapter2-route-graph.mjs'
      - 'tsconfig.simulation.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/simulation-runtime.yml'

jobs:
  simulation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture guard
        run: npm run simulation:guard

      - name: Strict typecheck
        run: npm run simulation:typecheck

      - name: Chapter 0 exploration guard
        run: npm run chapter0:guard

      - name: Chapter 0 route graph audit
        run: npm run chapter0:route-audit

      - name: Chapter 1 exploration guard
        run: npm run chapter1:guard

      - name: Chapter 1 route graph audit
        run: npm run chapter1:route-audit

      - name: Chapter 2 exploration guard
        run: npm run chapter2:guard

      - name: Chapter 2 route graph audit
        run: npm run chapter2:route-audit

      - name: Production build
        run: npm run simulation:build
